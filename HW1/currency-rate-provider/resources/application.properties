# Application name
spring.application.name=currency-rate-provider

# gRPC Server Configuration
grpc.server.port=${SERVER_PORT:9090}
server.port=${grpc.server.port}

# Zookeeper Configuration
zookeeper.connection-string=localhost:2181
zookeeper.session-timeout=60000
zookeeper.connection-timeout=15000
zookeeper.retry-base-sleep-time=1000
zookeeper.retry-max-attempts=3

# Service Registry Configuration
service.registry.path=/services/currency-rate-provider
service.host=localhost

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.currencyrate=INFO
logging.level.net.devh.boot.grpc=INFO
logging.level.org.apache.curator=INFO
logging.level.org.apache.zookeeper=WARN

# Application info
info.app.name=Currency Rate Provider
info.app.description=gRPC server providing USD/RUB exchange rates
info.app.version=1.0.0

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.server.port=8081
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99